# Payment Test Suite — CI Pipeline
#
# Stages:
#   1. Unit + Contract tests (no external dependencies)
#   2. Integration tests (WireMock as service container)
#      Live contract tests (real Stripe test mode, needs STRIPE_TEST_KEY secret)
#   Webhook template (lesson 6) runs in parallel — separate npm project
#
# E2E tests run separately on staging deploy (not in this workflow).

name: Payment Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Fast tests (unit + contract) ──────────────────
  unit-and-contract:
    name: Unit + Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

  # ── Webhook template (lesson 6, separate npm project) ──────
  webhook-template:
    name: Webhook Template Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: lessons/lesson06-webhooks/webhook-template

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lessons/lesson06-webhooks/webhook-template/package-lock.json

      - run: npm ci

      # Tests sign payloads locally and never call the Stripe API,
      # so dummy values are enough — no secrets needed
      - name: Webhook tests
        run: npm test -- --ci
        env:
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy

  # ── Stage 2: Integration tests (with WireMock) ─────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-and-contract  # only runs if Stage 1 passes
    timeout-minutes: 15

    services:
      wiremock:
        image: wiremock/wiremock:3.3.1
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/__admin/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Wait for WireMock
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/__admin/health && exit 0
            echo "Waiting for WireMock... ($i)"
            sleep 2
          done
          echo "WireMock did not start" && exit 1

      # Tests load stubs from lessons/lesson04-wiremock/stubs/ themselves (beforeAll)
      - name: Integration tests
        run: npm run test:integration -- --verbose
        env:
          WIREMOCK_URL: http://localhost:8080

  # ── Stage 2: Live contract tests (real Stripe API) ─────────
  contract-live:
    name: Live Contract Tests (Stripe)
    runs-on: ubuntu-latest
    needs: unit-and-contract  # only runs if Stage 1 passes
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Suite is skipped automatically if the secret is missing (e.g. PRs from forks)
      - name: Live contract tests
        run: npm run test:contract:live -- --verbose
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
